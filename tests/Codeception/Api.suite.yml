actor: ApiTester
path: Api
bootstrap: _bootstrap.php

modules:
  enabled:
    - Asserts
    - REST:
        url: '%SHOP_URL%'
        depends: PhpBrowser
        part: Json
    - \OxidEsales\Codeception\Module\Database:
        depends: Db
    - Db:
        dsn: 'mysql:host=%DB_HOST%;dbname=%DB_NAME%;charset=utf8'
        user: '%DB_USERNAME%'
        password: '%DB_PASSWORD%'
        port: '%DB_PORT%'
        dump: '%DUMP_PATH%'
        populate: false
        cleanup: false
